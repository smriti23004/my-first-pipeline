name: Build and Push Docker Container

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write # Required to push Docker containers to GitHub

jobs:
  # LEVEL 2: Automated testing
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run HTML Linter
        run: npx htmlhint index.html

  # LEVEL 3: DevSecOps Security Scan
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,config'
          format: 'table'
          exit-code: '1' 
          severity: 'CRITICAL,HIGH'

  # LEVEL 4: Build and Push Docker Container
  build-and-push:
    needs: [test, security] # Still waits for quality gates!
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub provides this automatically!
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # This tags the container using your GitHub username and repo name automatically
          tags: ghcr.io/${{ github.repository }}/my-website:latest
